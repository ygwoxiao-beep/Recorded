# LiteLLM Proxy 配置（OpenAI 兼容网关）
# 文档: https://docs.litellm.ai/docs/proxy/configs
#
# 环境变量（由 docker-compose 注入，勿把真实 Key 写进本文件）:
#   OPENAI_API_KEY      — OpenAI 平台密钥，由网关代管，客户端不再直连 OpenAI
#   LITELLM_MASTER_KEY  — 调用本代理时的 Bearer Token（可理解为「网关 API Key」）

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  # 客户端请求头: Authorization: Bearer <LITELLM_MASTER_KEY>
  master_key: os.environ/LITELLM_MASTER_KEY
